name: Release (finish)

# CI counterpart to phase 2 (--finish) of infrastructure/release/release-github.sh:
# runs once a release-prepare.yml PR (see release-prepare.yml) merges, and tags
# vX.Y.Z, re-points the floating "latest" tag, and creates the GitHub release
# from that version's CHANGELOG.md section — the manual step someone previously
# had to remember to come back and run.
#
# Requires the same RELEASE_PAT secret as release-prepare.yml, and for the same
# reason: a release created with the default GITHUB_TOKEN wouldn't fire a
# `release: published` event other workflows can react to (e.g. the npm-publish
# workflow proposed in #230), since GITHUB_TOKEN-authored events don't trigger
# other workflow runs. Tag pushes themselves aren't covered by main's branch
# ruleset either way (see CLAUDE.md's Versioning section).

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-finish
  cancel-in-progress: false

jobs:
  finish:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Determine the version and tag from global.json
        id: version
        run: |
          VERSION="$(jq -r .version global.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Guard against a tag that already exists
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag '$TAG' already exists locally or on origin"
            exit 1
          fi

      - name: Verify the CHANGELOG has this version's heading
        run: grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md

      - name: Extract this release's notes
        run: |
          awk -v heading="## [${{ steps.version.outputs.version }}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"

      - name: Move the floating 'latest' tag
        run: |
          git tag -d latest >/dev/null 2>&1 || true
          git push origin :refs/tags/latest >/dev/null 2>&1 || true
          git tag -a latest -m "Latest release (${{ steps.version.outputs.tag }})" "${{ steps.version.outputs.tag }}^{}"

      - name: Push tags
        run: |
          git push origin "${{ steps.version.outputs.tag }}"
          git push origin latest

      - name: Create the GitHub release
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --latest \
            --notes-file release-notes.md
