spring:
  config:
    import:
      - optional:classpath:deployment.properties

server:
  port: 8090

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

dlb:
  version: ${version:unknown}
  build-time: ${buildTime:}
  base-url: http://localhost:8090/dlb-external-var-service
  data-dir: config
  # Every variables call needs a Keycloak access token issued by issuer-uri, with audience in
  # its "aud" claim and required-role among resource_access.<audience>.roles.
  auth:
    issuer-uri: http://localhost:8081/realms/dialoguebranch
    # jwk-set-uri: defaults to Keycloak's, <issuer-uri>/protocol/openid-connect/certs
    audience: dlb-variable-service
    required-role: evs-access
