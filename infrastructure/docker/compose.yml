# Dialogue Branch — local development services.
#
# Starts MariaDB, phpMyAdmin, and Keycloak with hard-coded dev credentials.
# No configuration files are required. Run from infrastructure/docker/:
#
#   docker compose up -d                              # supporting services only
#   docker compose --profile api up -d                # also build and run the API and the BFF
#   docker compose --profile variable-service up -d   # also build and run the mock variable service
#   docker compose --profile studio up -d             # everything containerized: API, BFF,
#                                                      # Studio, and a proxy in front, mirroring
#                                                      # a real deployment (see issue #81)
#
#   docker compose -f compose.yml -f compose.variable-service.yml --profile api up -d
#       # the --profile api stack, plus the mock variable service, with the API wired to it
#       # (see compose.variable-service.yml) — for testing the EVS integration end to end
#
# Three local development setups, matching what a given change actually needs:
#
#   1. Web service only: this file with no profile, run the API separately (e.g. `./gradlew
#      bootRun` in apps/api).
#   2. Dialogue Branch Studio development: `--profile api` (API + BFF in Docker), run Studio
#      separately (`npm run dev` in apps/studio) — its vite.config.js dev-server proxy sends
#      /api, /oauth2, /login, /logout, /whoami, /actuator to the Dockerized BFF on
#      http://localhost:8082, so the browser only ever talks to Vite's own origin.
#   3. Everything in Docker (`--profile studio`): Studio and BFF run as containers too,
#      fronted by the `nginx` service below on http://localhost:8080 — since Vite's dev-server
#      proxy isn't available here, this proxy is what makes the (containerized) Studio and
#      BFF same-origin instead, the same way a production reverse proxy would.
#
# Studio (apps/studio) authenticates through the BFF, not Keycloak directly — see
# apps/bff's Javadoc.

name: dlb-dev

services:

  # ---------------------------------------------------------------------------
  # MariaDB — relational database
  # ---------------------------------------------------------------------------

  mariadb:
    image: mariadb:11
    container_name: dlb-dev-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: dev
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./import/mariadb/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # phpMyAdmin — database browser
  # ---------------------------------------------------------------------------

  phpmyadmin:
    image: phpmyadmin:5
    container_name: dlb-dev-phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: dev
    ports:
      - "8100:80"
    depends_on:
      mariadb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Keycloak — identity and access management
  #
  # The entrypoint injects the BFF's redirect URI into the realm export before
  # importing it (the dlb-bff client is confidential, its dev secret is set
  # directly in the realm export — dev-only, not used for any real deployment).
  # Override KEYCLOAK_BFF_REDIRECT_URI to point at a different deployed BFF
  # instance.
  #
  # The custom DLB login theme (../keycloak/themes/dlb) is mounted read-only and
  # applied via the realm export's "loginTheme": "dlb".
  # ---------------------------------------------------------------------------

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: dlb-dev-keycloak
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /opt/keycloak/data/import
        sed -e "s|__BFF_REDIRECT_URI__|$${KEYCLOAK_BFF_REDIRECT_URI}|" \
            -e "s|__BFF_POST_LOGOUT_REDIRECT_URI__|$${KEYCLOAK_BFF_POST_LOGOUT_REDIRECT_URI}|" \
          /opt/keycloak/data/import-source/dialoguebranch-realm.json \
          > /opt/keycloak/data/import/dialoguebranch-realm.json
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm \
          --spi-theme--static-max-age=-1 --spi-theme--cache-themes=false --spi-theme--cache-templates=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mariadb
      KC_DB_URL_HOST: mariadb
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: dev
      KEYCLOAK_BFF_REDIRECT_URI: http://localhost:8082/login/oauth2/code/keycloak
      KEYCLOAK_BFF_POST_LOGOUT_REDIRECT_URI: http://localhost:5173/
    ports:
      - "8081:8080"
    volumes:
      - ./import/dialoguebranch-realm.json:/opt/keycloak/data/import-source/dialoguebranch-realm.json:ro
      - ../keycloak/themes/dlb:/opt/keycloak/themes/dlb:ro
    depends_on:
      mariadb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Keycloak realm sync — adds any client missing from an already-existing realm
  #
  # --import-realm (above) only fires on a genuinely fresh realm; once a developer already has a
  # local MariaDB volume with the realm in it, re-mounting dialoguebranch-realm.json does nothing
  # on its own. This one-shot script fills that gap without touching any existing client or data
  # (see infrastructure/keycloak/sync-realm.py's docstring) — safe, and cheap, to run every time.
  # ---------------------------------------------------------------------------

  keycloak-sync:
    image: python:3.13-alpine
    container_name: dlb-dev-keycloak-sync
    volumes:
      - ./import/dialoguebranch-realm.json:/realm-export.json:ro
      - ../keycloak/sync-realm.py:/sync-realm.py:ro
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_BFF_REDIRECT_URI: http://localhost:8082/login/oauth2/code/keycloak
      KEYCLOAK_BFF_POST_LOGOUT_REDIRECT_URI: http://localhost:5173/
      # Same values as the bff/bff-studio services' own DLB_BFF_SESSION_TIMEOUT/
      # DLB_BFF_SESSION_MAX_AGE below: the single source of truth sync-realm.py mirrors into
      # Keycloak's session settings.
      DLB_BFF_SESSION_TIMEOUT: ${DLB_BFF_SESSION_TIMEOUT:-7d}
      DLB_BFF_SESSION_MAX_AGE: ${DLB_BFF_SESSION_MAX_AGE:-30d}
    depends_on:
      keycloak:
        condition: service_started
    command: ["python3", "/sync-realm.py"]

  # ---------------------------------------------------------------------------
  # Dialogue Branch Web Service — the API (optional, start with --profile api)
  # ---------------------------------------------------------------------------

  dlb-web-service:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    profiles:
      - api
      - studio
    container_name: dlb-dev-api
    environment:
      DLB_AUTH_KEYCLOAK_BASE_URL: http://keycloak:8080/
      # Browser-facing Keycloak URL, used to build the OAuth2 authorize/token URLs shown in
      # Swagger UI — differs from DLB_AUTH_KEYCLOAK_BASE_URL because the container-internal
      # "keycloak" hostname above is not reachable from the developer's browser.
      DLB_AUTH_KEYCLOAK_BROWSER_BASE_URL: http://localhost:8081/
      # Tokens are accepted only from the clients listed in DLB_AUTH_KEYCLOAK_TRUSTED_CLIENTS,
      # matched on the token's "azp" claim (see apps/api AzpClaimValidator). Left unset here: the
      # default already trusts "dlb-web-service" (direct API clients, Swagger UI) and "dlb-bff"
      # (calls proxied through the BFF, i.e. all of Dialogue Branch Studio). Set it to a
      # comma-separated list to trust additional clients, or to "*" to trust any client in the realm.
      DLB_MARIADB_HOST: mariadb
      DLB_MARIADB_PASSWORD: dev
    ports:
      - "8089:8089"
    depends_on:
      mariadb:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Dialogue Branch BFF (optional, start with --profile api)
  #
  # Backend-for-Frontend for Dialogue Branch Studio (apps/studio) — see apps/bff's Javadoc.
  # ---------------------------------------------------------------------------

  bff:
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    profiles:
      - api
    container_name: dlb-dev-bff
    environment:
      DLB_BFF_KEYCLOAK_BASE_URL: http://keycloak:8080/
      # Browser-facing Keycloak URL, used to redirect the browser for login/logout — differs
      # from DLB_BFF_KEYCLOAK_BASE_URL because the container-internal "keycloak" hostname above
      # is not reachable from the developer's browser.
      DLB_BFF_KEYCLOAK_BROWSER_BASE_URL: http://localhost:8081/
      DLB_BFF_API_BASE_URL: http://dlb-web-service:8089/dlb-web-service
      DLB_BFF_OAUTH2_CLIENT_SECRET: dev-secret
      # Dialogue Branch Studio's own dev server (npm run dev), a different origin than this BFF — see
      # the property's own comment in apps/bff's application.yml for why this can't just be "/".
      DLB_BFF_POST_LOGIN_REDIRECT_URL: http://localhost:5173/
      DLB_BFF_MARIADB_HOST: mariadb
      DLB_BFF_MARIADB_PASSWORD: dev
      DLB_BFF_SESSION_TIMEOUT: ${DLB_BFF_SESSION_TIMEOUT:-7d}
      DLB_BFF_SESSION_MAX_AGE: ${DLB_BFF_SESSION_MAX_AGE:-30d}
    ports:
      - "8082:8082"
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
      dlb-web-service:
        condition: service_started
      mariadb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # "studio" profile — everything containerized (issue #81)
  #
  # A second BFF instance and Dialogue Branch Studio itself, both fronted by nginx below on
  # http://localhost:8080, the single origin a browser talks to for this profile. Not exposed on
  # their own host ports — only nginx is a genuine entry point here, matching a real deployment.
  # ---------------------------------------------------------------------------

  # A separate instance from `bff` above (same dlb-bff Keycloak client and secret, just a second
  # running container) rather than reusing it: that one's DLB_BFF_POST_LOGIN_REDIRECT_URL is
  # hardcoded to Vite's dev-server origin, which only works because Vite's proxy rewrites the
  # Host header it forwards (see vite.config.js's changeOrigin: true), hiding the browser's real
  # origin from the BFF entirely. nginx's studio.conf does the opposite on purpose — it preserves
  # the real Host header — so this instance can (and must) leave DLB_BFF_POST_LOGIN_REDIRECT_URL
  # unset: its default, a relative "/", already resolves correctly against whatever origin the
  # browser actually used (see application.yml's own comment on that default), exactly like a real
  # deployment.
  bff-studio:
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    profiles:
      - studio
    container_name: dlb-dev-bff-studio
    environment:
      DLB_BFF_KEYCLOAK_BASE_URL: http://keycloak:8080/
      DLB_BFF_KEYCLOAK_BROWSER_BASE_URL: http://localhost:8081/
      DLB_BFF_API_BASE_URL: http://dlb-web-service:8089/dlb-web-service
      DLB_BFF_OAUTH2_CLIENT_SECRET: dev-secret
      DLB_BFF_MARIADB_HOST: mariadb
      DLB_BFF_MARIADB_PASSWORD: dev
      DLB_BFF_SESSION_TIMEOUT: ${DLB_BFF_SESSION_TIMEOUT:-7d}
      DLB_BFF_SESSION_MAX_AGE: ${DLB_BFF_SESSION_MAX_AGE:-30d}
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
      dlb-web-service:
        condition: service_started
      mariadb:
        condition: service_healthy

  # Dialogue Branch Studio's own static build (apps/studio/Dockerfile) — its default build args already talk
  # to the BFF via same-origin relative paths (/api/v1 etc.), which is exactly what nginx below
  # provides, so nothing needs overriding here.
  studio:
    build:
      context: ../..
      dockerfile: apps/studio/Dockerfile
    profiles:
      - studio
    container_name: dlb-dev-studio

  # Single entry point for this profile — path-splits between `studio` (the static SPA) and
  # `bff-studio` (everything the SPA can't serve itself), so they appear to the browser as one
  # origin. See studio.conf for the exact path list and why Host must be preserved, not rewritten.
  nginx:
    image: nginx:1.27-alpine
    container_name: dlb-dev-nginx
    profiles:
      - studio
    volumes:
      - ./nginx/studio.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      studio:
        condition: service_started
      bff-studio:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Mock External Variable Service (optional, start with --profile variable-service)
  #
  # A dummy implementation of the "External Variable Service" protocol, used to
  # test the dlb-web-service's integration with an external variable back-end.
  #
  # To run the Dockerised API wired to this service, add the compose.variable-service.yml
  # overlay (see its header) rather than setting the variables by hand:
  #   docker compose -f compose.yml -f compose.variable-service.yml --profile api up -d
  #
  # To point an API running OUTSIDE this stack (e.g. ./gradlew bootRun) at it, set:
  #   DLB_EXTERNAL_VARIABLE_SERVICE_ENABLED=true
  #   DLB_EXTERNAL_VARIABLE_SERVICE_URL=http://localhost:8090
  #   DLB_EXTERNAL_VARIABLE_SERVICE_API_KEY=dev
  # (matching the DLB_AUTH_API_KEY set below).
  # ---------------------------------------------------------------------------

  mock-variable-service:
    build:
      context: ../..
      dockerfile: apps/mock-variable-service/Dockerfile
    profiles:
      - variable-service
    container_name: dlb-dev-mock-variable-service
    environment:
      DLB_AUTH_API_KEY: dev
    ports:
      - "8090:8090"

volumes:
  mariadb-data:
