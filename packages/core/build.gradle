import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
	id 'base'
	id 'java'
	id 'java-library'
	id 'application'
	id 'distribution'
	id 'maven-publish'
	id 'signing'
	// Plugins for Publishing to the Sonatype Central Portal
	// See: https://gradleup.com/nmcp/
	id 'com.gradleup.nmcp' version '1.5.0'
	id 'com.gradleup.nmcp.aggregation' version '1.5.0'
	id 'com.diffplug.spotless' version '8.10.1'
	// Runs NullAway (see below) as an error-prone check to enforce the JSpecify
	// nullness contract adopted in #95. See issue #117.
	id 'net.ltgt.errorprone' version '5.1.1'
}

group = 'com.dialoguebranch'

// Version is defined once for the entire monorepo in /global.json.
// To release a new version, update it there.
version = new groovy.json.JsonSlurper()
        .parse(new File(projectDir.parentFile.parentFile, 'global.json'))
        .version

base {
	archivesName = 'dlb-core-java'
}

repositories {
	mavenCentral()
}

// Mechanical style hygiene only — no line-reflowing formatter. `./gradlew spotlessApply`
// fixes violations; `spotlessCheck` runs as part of `check`. See issue #96 / CONTRIBUTING.md.
spotless {
	java {
		removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
		importOrder('', 'java|javax', '\\#')
		trimTrailingWhitespace()
		endWithNewline()
	}
}

application {
	mainClass = "com.dialoguebranch.cli.DialogueBranchCLI"
}

run {
	standardInput = System.in
}

sourceSets {
	test {
		resources {
			srcDir '../../examples'
		}
	}
}

java {
	// Compile and test on a pinned JDK 21 toolchain (auto-provisioned via the
	// foojay resolver in settings.gradle), regardless of the JDK on PATH. See issue #106.
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	if (project.properties['buildEnv'] == null || !project.properties['buildEnv'].equals('dev')) {
		withJavadocJar()
		withSourcesJar()
	}
}

// Keep the published bytecode / language level at 17 so downstream consumers on JDK 17+
// are unaffected; `release` cross-compiles against the real 17 API.
tasks.withType(JavaCompile).configureEach {
	options.release = 17

	// NullAway checks the JSpecify nullness contract (#95) on our own code only. The rest
	// of error-prone's bug patterns are out of scope for #117, so everything else is off.
	//
	// Severity is WARN for now: the initial audit surfaced ~100 findings (a mix of the
	// data-flow spots #95 deferred and framework-populated bean fields). They are being
	// worked down in follow-up passes; flip this to ERROR once the count reaches zero so
	// CI blocks regressions.
	options.errorprone {
		disableAllChecks = true
		check('NullAway', CheckSeverity.WARN)
		option('NullAway:AnnotatedPackages', 'com.dialoguebranch')
	}
}

// src/test is deliberately not @NullMarked (see #95) — don't run NullAway over it.
tasks.named('compileTestJava') {
	options.errorprone.enabled = false
}

javadoc {
	source = sourceSets.main.allJava
	destinationDir = reporting.baseDirectory.dir("javadoc").get().asFile
	include 'com/dialoguebranch/**'
	options.source = "17"
	options.addStringOption('Xmaxwarns', '1000')
}

dependencies {
	api "nl.rrd:rrd-utils:3.0.3"
	api 'com.fasterxml.jackson.module:jackson-modules-java8:2.19.0'
	// JSpecify nullness annotations (@NullMarked / @Nullable). Annotations-only, CLASS retention,
	// no transitive deps, no runtime cost; `api` so downstream tooling can resolve the contract.
	api 'org.jspecify:jspecify:1.0.0'
	testImplementation 'junit:junit:4.13.2'
	api 'org.slf4j:slf4j-api:2.0.16'

	// Compile-only nullness checker (see the errorprone config above). Not on any
	// runtime or published classpath.
	errorprone 'com.google.errorprone:error_prone_core:2.50.0'
	errorprone 'com.uber.nullaway:nullaway:0.14.1'
}

jar {
	manifest {
		attributes 'Main-Class': 'com.dialoguebranch.cli.DialogueBranchCLI'
		attributes 'Class-Path': configurations.compileClasspath.collect({ it.name }).join(' ')
	}
}

distributions {
	main {
		distributionBaseName = base.archivesName
		contents {
			from jar
		}
	}
}

[distZip, distTar, installDist]*.dependsOn jar

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			pom {
				name = 'Dialogue Branch Core Java Library'
				description = 'Dialogue Branch gives you creative freedom to write engaging interactive conversations...'
				url = 'https://www.dialoguebranch.com'
				packaging = 'jar'

				licenses {
					license {
						name = 'MIT License'
						url = 'https://opensource.org/licenses/MIT'
					}
				}
				developers {
					developer {
						id = 'hopdenakker'
						name = 'Harm op den Akker'
						email = 'hopdenakker@fruittreelabs.com'
						organizationUrl = 'https://dialoguebranch.com/'
					}
					developer {
						id = 'dhofs'
						name = 'Dennis Hofs'
						email = 'dennis.hofs@cube.nl'
						organizationUrl = 'https://cube.nl'
					}
				}
				scm {
					url = 'https://github.com/dialoguebranch/dlb-core-java/tree/main'
					connection = 'scm:git:git://github.com/dialoguebranch/dlb-core-java.git'
					developerConnection = 'scm:git:ssh://github.com:dialoguebranch/dlb-core-java.git'
				}
			}
		}
	}
}

signing {
	sign publishing.publications.maven
}

tasks.register('publishToMaven') {
	dependsOn 'publishAggregationToCentralPortal'
	group = 'publishing'
	description = 'Publishes this library to Maven Central via the Sonatype Central Portal.'
}

// use Gradle task 'publishToMaven'
nmcpAggregation {
	centralPortal {
		username = providers.gradleProperty('centralPortal.username')
		password = providers.gradleProperty('centralPortal.password')
		publishingType = 'USER_MANAGED'
	}
}

dependencies {
	nmcpAggregation project(path)
}